 t=t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{blocks.push(`<div class="cb"><div><span>${esc(l||"code")}</span><span>${/^(html|svg)$/i.test(l)?'<button data-prev>▶ پیش‌نمایش</button>':''}<button data-dl>⬇</button><button data-copy>کپی</button></span></div><pre><code>${esc(c.replace(/\n$/,""))}</code></pre></div>`);return`\u0000${blocks.length-1}\u0000`});
 t=esc(t).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>");
 const out=[];let list=null;
 for(const ln of t.split("\n")){
  let m;
  if(m=ln.match(/^\s*[-*•]\s+(.*)/)){if(list!=="ul"){if(list)out.push(`</${list}>`);out.push("<ul>");list="ul"}out.push(`<li>${m[1]}</li>`);continue}
  if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){if(list)out.push(`</${list}>`);out.push("<ol>");list="ol"}out.push(`<li>${m[1]}</li>`);continue}
  if(list){out.push(`</${list}>`);list=null}
  if(m=ln.match(/^(#{1,3})\s+(.*)/))out.push(`<h${m[1].length}>${m[2]}</h${m[1].length}>`);
  else if(ln.trim())out.push(`<p>${ln}</p>`);
 }
 if(list)out.push(`</${list}>`);
 return out.join("").replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]).replace(/<p>(<div class="cb">[\s\S]*?<\/div>)<\/p>/g,"$1");
}
